spring:
  application:
    name: academic-registration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:academic_registration}
    username: ${DB_USER:academic}
    password: ${DB_PASSWORD:academic}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dGhpc2lzYXNlY3JldGtleWZvcmp3dHNpZ25pbmdhdGxlYXN0MjU2Yml0cw==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    br.com.techne.lyceum.academic: INFO
    org.flywaydb: INFO
