services:
  postgres:
    image: postgres:16-alpine
    container_name: academic-registration-db
    environment:
      POSTGRES_DB: academic_registration
      POSTGRES_USER: academic
      POSTGRES_PASSWORD: academic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic -d academic_registration"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
